defaults:
  - default
  - layers@blocks: flux
  - _self_

main_layers: ${merge:${model.blocks.double_stream}, ${model.blocks.single_stream}}
main_layers_norm: ${merge:${model.blocks.double_stream}, ${model.blocks.single_stream}}

weight_layers_calibration: ${model.main_layers}
input_layers_calibration: ${model.main_layers}

weight_layers: ${model.main_layers_norm}
input_layers: ${model.main_layers}

output_layers: []

name: flux_dev
pipeline_name: FluxPipeline

pipeline:
  pretrained_model_name_or_path: "black-forest-labs/FLUX.1-dev"
  torch_dtype: ${torch_dtype:bfloat16}

guidance_scale: 3.5
num_inference_steps: 50
